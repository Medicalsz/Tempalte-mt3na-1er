<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Prendre une photo</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      background:#1a1a2e; display:flex; flex-direction:column;
      align-items:center; justify-content:center; min-height:100vh;
      color:white; font-family:Arial,sans-serif; gap:14px;
    }
    #video {
      width:320px; height:240px; border-radius:14px;
      background:#111; border:3px solid #C2185B; object-fit:cover;
    }
    #canvas { display:none; }
    #preview {
      width:180px; height:180px; border-radius:50%; object-fit:cover;
      border:4px solid #C2185B; display:none;
      box-shadow:0 0 20px rgba(194,24,91,0.5);
    }
    .btn {
      padding:10px 28px; border:none; border-radius:24px;
      cursor:pointer; font-size:14px; font-weight:bold;
      transition:transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform:scale(0.96); }
    #captureBtn { background:#C2185B; color:white; }
    #retakeBtn  { background:#555; color:white; display:none; }
    #useBtn     { background:#43A047; color:white; display:none; }
    .btn-row    { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
    #status     { font-size:12px; color:#aaa; text-align:center; max-width:300px; }
    #errMsg     {
      color:#ff6b6b; font-size:12px; text-align:center;
      max-width:280px; display:none; line-height:1.5;
    }
  </style>
</head>
<body>
  <video id="video" autoplay playsinline muted></video>
  <canvas id="canvas"></canvas>
  <img id="preview" alt="preview"/>
  <div class="btn-row">
    <button class="btn" id="captureBtn" onclick="capture()">📸 Capturer</button>
    <button class="btn" id="retakeBtn"  onclick="retake()">🔄 Reprendre</button>
    <button class="btn" id="useBtn"     onclick="usePhoto()">✓ Utiliser cette photo</button>
  </div>
  <div id="status">Initialisation de la caméra…</div>
  <div id="errMsg">
    Caméra non disponible ou accès refusé.<br>
    Fermez cette fenêtre et utilisez le sélecteur de fichiers.
  </div>

  <script>
    var stream = null;
    var capturedData = null;

    function setStatus(msg) { document.getElementById('status').textContent = msg; }

    navigator.mediaDevices.getUserMedia({ video: { width:640, height:480 }, audio:false })
      .then(function(s) {
        stream = s;
        document.getElementById('video').srcObject = s;
        setStatus('Caméra prête — cliquez sur Capturer');
      })
      .catch(function(err) {
        document.getElementById('status').style.display = 'none';
        document.getElementById('errMsg').style.display  = 'block';
        document.getElementById('captureBtn').disabled   = true;
        if (window.javaBridge) window.javaBridge.onError(err.message || 'Camera unavailable');
      });

    function capture() {
      var v = document.getElementById('video');
      var c = document.getElementById('canvas');
      c.width = v.videoWidth  || 640;
      c.height = v.videoHeight || 480;
      c.getContext('2d').drawImage(v, 0, 0);
      capturedData = c.toDataURL('image/jpeg', 0.85);

      document.getElementById('preview').src = capturedData;
      document.getElementById('preview').style.display = 'block';
      document.getElementById('video').style.display   = 'none';
      document.getElementById('captureBtn').style.display = 'none';
      document.getElementById('retakeBtn').style.display  = 'inline-block';
      document.getElementById('useBtn').style.display     = 'inline-block';
      setStatus('Photo capturée — utiliser ou reprendre');

      if (stream) stream.getTracks().forEach(function(t){ t.stop(); });
    }

    function retake() {
      capturedData = null;
      document.getElementById('preview').style.display = 'none';
      document.getElementById('video').style.display   = 'block';
      document.getElementById('captureBtn').style.display  = 'inline-block';
      document.getElementById('retakeBtn').style.display   = 'none';
      document.getElementById('useBtn').style.display      = 'none';
      navigator.mediaDevices.getUserMedia({ video:true, audio:false })
        .then(function(s){ stream = s; document.getElementById('video').srcObject = s; });
    }

    function usePhoto() {
      if (capturedData && window.javaBridge) window.javaBridge.onPhoto(capturedData);
    }
  </script>
</body>
</html>
